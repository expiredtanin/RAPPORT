server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PocketBase-Backups/-Uploads können mehrere MB gross sein — Default (1M) reicht nicht.
  client_max_body_size 100M;

  # Kompression für App-Bundle und API-JSON (PocketBase komprimiert selbst nicht).
  # text/event-stream (Realtime/SSE) bewusst NICHT: gzip puffert und würde Live-Events zurückhalten.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Sicherheits-Header. Achtung nginx: add_header in einer location ERSETZT die Header der
  # server-Ebene (keine Vererbung) — deshalb in jeder location mit eigenem add_header
  # wiederholt (vorher fehlten sie gerade für index.html und /assets/).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hash-versionierte Assets — langer Cache OK
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # PocketBase-Admin-UI (/_/) unter der App-Domain mitservieren, RAPPORT-Theme injiziert.
  # sub_filter kann nur unkomprimierten Body durchsuchen — Accept-Encoding zum Upstream
  # leeren, sonst bleibt PBs Antwort gzip-kodiert und das Insert vor </head> greift nicht.
  location /_/ {
    proxy_pass http://pb:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<link rel="stylesheet" href="/rapport-admin-theme.css"></head>';
    sub_filter_once on;
  }

  # PocketBase-API (Auth/Collections/Realtime) — von der Admin-UI (/_/) als same-origin
  # ./api/... aufgerufen; die App kann sie ebenfalls hierüber nutzen (API_EXTERNAL_URL =
  # Adresse des Frontends), dann reicht ein offener Port und die Antworten sind komprimiert.
  # /api/realtime ist ein langlebiger SSE-Stream: Buffering aus, sonst hält nginx die
  # Events zurück statt sie live durchzureichen. X-Forwarded-For: echte Client-IP für die
  # Rate-Limits von PocketBase (wirkt nur mit trustedProxy, siehe pb-entrypoint.sh).
  location /api/ {
    proxy_pass http://pb:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # SPA-Fallback: unbekannte Pfade → index.html (React-Routing-kompatibel)
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    # Content-Security-Policy nur für die App (nicht für /_/, das PocketBase-Dashboard bringt eigene Skripte mit):
    # kein fremdes Skript, kein eval (ausser WebAssembly für die Beleg-Texterkennung), Verbindungen nur zur eigenen
    # Adresse und zur PocketBase-URL (__API_ORIGIN__ setzt Dockerfile.app aus POCKETBASE_URL). Begrenzt den Schaden,
    # falls doch einmal HTML/Skript in gespeicherte Daten gelangt (das Login-Token liegt im localStorage).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; worker-src 'self' blob:; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
