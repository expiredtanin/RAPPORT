server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PocketBase-Backups/-Uploads können mehrere MB gross sein — Default (1M) reicht nicht.
  client_max_body_size 100M;

  # Hash-versionierte Assets — langer Cache OK
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PocketBase-Admin-UI (/_/) unter der App-Domain mitservieren, RAPPORT-Theme injiziert.
  # sub_filter kann nur unkomprimierten Body durchsuchen — Accept-Encoding zum Upstream
  # leeren, sonst bleibt PBs Antwort gzip-kodiert und das Insert vor </head> greift nicht.
  location /_/ {
    proxy_pass http://pb:8090;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<link rel="stylesheet" href="/rapport-admin-theme.css"></head>';
    sub_filter_once on;
  }

  # PocketBase-API (Auth/Collections/Realtime) — von der Admin-UI (/_/) als same-origin
  # ./api/... aufgerufen. /api/realtime ist ein langlebiger SSE-Stream: Buffering aus,
  # sonst hält nginx die Events zurück statt sie live durchzureichen.
  location /api/ {
    proxy_pass http://pb:8090;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # SPA-Fallback: unbekannte Pfade → index.html (React-Routing-kompatibel)
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
